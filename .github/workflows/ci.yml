name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: build / test / eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Seed recovery tests
        run: npm run test:seed

      - name: Eval suite
        run: npm run eval

      - name: Build web
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t player-dev-platform:ci -f platform/Dockerfile .
